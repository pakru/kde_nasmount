name: Native package release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate_release:
    name: Validate tag and release contract
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.contract.outputs.tag }}
      version: ${{ steps.contract.outputs.version }}
      release: ${{ steps.contract.outputs.release }}
      commit: ${{ steps.contract.outputs.commit }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate version, commit, and existing assets
        id: contract
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(tr -d '[:space:]' < VERSION)
          release=$(tr -d '[:space:]' < packaging/RELEASE)
          [ "$REQUESTED_TAG" = "v$version" ]
          [[ "$release" =~ ^[1-9][0-9]*$ ]]
          commit=$(git rev-parse HEAD)
          [ "$commit" = "$(git rev-parse "$REQUESTED_TAG^{commit}")" ]
          git diff --quiet
          git diff --cached --quiet
          if gh release view "$REQUESTED_TAG" --json isDraft,assets > existing.json 2>/dev/null; then
            jq -e '.isDraft == true and (.assets | length == 0)' existing.json >/dev/null
          fi
          printf 'tag=%s\nversion=%s\nrelease=%s\ncommit=%s\n' \
            "$REQUESTED_TAG" "$version" "$release" "$commit" >> "$GITHUB_OUTPUT"

  build_deb_release:
    name: Rebuild Ubuntu 26.04 DEB from tag
    needs: validate_release
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04@sha256:7b202b0e2e0028c6250f5fcf41d04df492d145a1654c6995a6553f0c1f6f1960
    steps:
      - name: Check out validated tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate_release.outputs.tag }}
          fetch-depth: 0
      - name: Install Ubuntu build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            appstream binutils build-essential ca-certificates cmake debhelper devscripts \
            extra-cmake-modules file git jq libkf6auth-dev libkf6config-dev \
            libkf6coreaddons-dev libkf6i18n-dev libkf6kcmutils-dev \
            libkf6widgetsaddons-dev lintian qt6-base-dev qt6-declarative-dev systemd
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build, test, lint, and inspect DEB
        run: |
          mkdir -p artifacts logs
          chown builder:builder artifacts logs
          runuser -u builder -- ./packaging/build-deb.sh artifacts | tee logs/build.log
          lintian --fail-on error artifacts/*.deb | tee logs/lintian.log
          dpkg-deb --info artifacts/*.deb > logs/info.txt
          dpkg-deb --contents artifacts/*.deb > logs/files.txt
          dpkg-query -W > logs/build-packages.txt
      - name: Upload release DEB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package-ubuntu-26.04-amd64
          path: |
            artifacts/*.deb
            logs/
          if-no-files-found: error

  build_rpm_release:
    name: Rebuild Fedora 44 RPM from tag
    needs: validate_release
    runs-on: ubuntu-24.04
    container:
      image: fedora:44@sha256:89f61a124414261868224666aa7fb8df1b78397a53623774bdfb105d1612b48b
    steps:
      - name: Install action runtime and build dependencies
        run: |
          dnf install -y --allowerasing --setopt=install_weak_deps=False \
            appstream binutils cmake cpio diffutils extra-cmake-modules file findutils \
            gcc-c++ git gzip jq kf6-kauth-devel kf6-kcmutils-devel \
            kf6-kconfig-devel kf6-kcoreaddons-devel kf6-ki18n-devel \
            kf6-kwidgetsaddons-devel qt6-qtbase-devel qt6-qtdeclarative-devel \
            rpm-build rpmlint systemd systemd-rpm-macros tar
      - name: Check out validated tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate_release.outputs.tag }}
          fetch-depth: 0
      - name: Build, test, lint, and inspect RPM
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p artifacts logs
          chown builder:builder artifacts logs
          runuser -u builder -- ./packaging/build-rpm.sh artifacts | tee logs/build.log
          rpmlint artifacts/*.rpm | tee logs/rpmlint.log
          rpm -qpi artifacts/*.rpm > logs/info.txt
          rpm -qpl artifacts/*.rpm > logs/files.txt
          rpm -qpR artifacts/*.rpm > logs/requires.txt
          rpm -qa > logs/build-packages.txt
      - name: Upload release RPM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package-fedora-44-x86_64
          path: |
            artifacts/*.rpm
            logs/
          if-no-files-found: error

  smoke_release_packages:
    name: Release smoke ${{ matrix.target }}
    needs: [validate_release, build_deb_release, build_rpm_release]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-26.04-amd64
            family: deb
            image: ubuntu:26.04@sha256:7b202b0e2e0028c6250f5fcf41d04df492d145a1654c6995a6553f0c1f6f1960
            artifact: release-package-ubuntu-26.04-amd64
          - target: fedora-44-x86_64
            family: rpm
            image: fedora:44@sha256:89f61a124414261868224666aa7fb8df1b78397a53623774bdfb105d1612b48b
            artifact: release-package-fedora-44-x86_64
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install smoke-test tools
        run: |
          if [ "${{ matrix.family }}" = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils file sudo
          else
            dnf install -y --allowerasing --setopt=install_weak_deps=False \
              binutils diffutils file sudo
          fi
      - name: Check out validated inspection scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate_release.outputs.tag }}
      - name: Download matching package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          path: downloaded
      - name: Install and remove final package
        run: |
          mkdir -p logs
          if [ "${{ matrix.family }}" = deb ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ./downloaded/artifacts/*.deb
            dpkg-query -L nasmount > logs/owned-paths.txt
            bash packaging/smoke-installed-package.sh deb '${{ needs.validate_release.outputs.version }}' \
              | tee logs/inspection.txt
            # Seed managed state. Both families now tear it down themselves:
            # `apt remove` disarms and `apt purge` deletes; RPM has no split, so
            # an erase does both. No running systemd here, so the unmount half
            # is short-circuited and belongs to the VM checklist.
            corpus=tests/golden/units/v0.1.0
            install -d -m 0700 /etc/nasmount
            install -m 0600 /dev/null /etc/nasmount/0123456789abcdef0123456789abcdef.cred
            install -m 0644 "$corpus/credentials.mount" \
              /etc/systemd/system/home-tester-mnt-media.mount
            install -m 0644 "$corpus/credentials.automount" \
              /etc/systemd/system/home-tester-mnt-media.automount

            DEBIAN_FRONTEND=noninteractive apt-get remove -y nasmount
            ! dpkg-query -s nasmount 2>/dev/null \
              | grep -q '^Status: install ok installed$'
            # remove is not purge: state must survive for a later purge.
            [ -f /etc/systemd/system/home-tester-mnt-media.mount ]
            [ -f /etc/nasmount/0123456789abcdef0123456789abcdef.cred ]

            DEBIAN_FRONTEND=noninteractive apt-get purge -y nasmount
            for leftover in /etc/systemd/system/home-tester-mnt-media.mount \
                            /etc/systemd/system/home-tester-mnt-media.automount \
                            /etc/nasmount; do
              if [ -e "$leftover" ]; then
                echo "ERROR: removal left $leftover behind" >&2
                exit 1
              fi
            done
          else
            dnf install -y --allowerasing --setopt=install_weak_deps=False \
              ./downloaded/artifacts/*.rpm
            rpm -ql nasmount > logs/owned-paths.txt
            bash packaging/smoke-installed-package.sh rpm '${{ needs.validate_release.outputs.version }}' \
              | tee logs/inspection.txt
            # Seed managed state. Both families now tear it down themselves:
            # `apt remove` disarms and `apt purge` deletes; RPM has no split, so
            # an erase does both. No running systemd here, so the unmount half
            # is short-circuited and belongs to the VM checklist.
            corpus=tests/golden/units/v0.1.0
            install -d -m 0700 /etc/nasmount
            install -m 0600 /dev/null /etc/nasmount/0123456789abcdef0123456789abcdef.cred
            install -m 0644 "$corpus/credentials.mount" \
              /etc/systemd/system/home-tester-mnt-media.mount
            install -m 0644 "$corpus/credentials.automount" \
              /etc/systemd/system/home-tester-mnt-media.automount

            rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort \
              > logs/rpm-packages-before-removal.txt
            dnf remove -y --no-autoremove nasmount
            ! rpm -q nasmount >/dev/null 2>&1
            rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort \
              > logs/rpm-packages-after-removal.txt
            # --no-autoremove must leave every dependency in place. Build the
            # expected after-set by removing exactly the nasmount line and
            # compare byte for byte. A `diff | grep -v` check cannot work here:
            # every content line diff emits starts with '<' or '>', so the
            # filter eats them all and the test passes no matter what changed.
            [ "$(grep -c '^nasmount-' logs/rpm-packages-before-removal.txt)" -eq 1 ]
            grep -v '^nasmount-' logs/rpm-packages-before-removal.txt \
              > logs/rpm-packages-expected-after.txt
            cmp logs/rpm-packages-expected-after.txt logs/rpm-packages-after-removal.txt || {
              echo 'ERROR: Fedora removal changed packages other than nasmount' >&2
              diff logs/rpm-packages-expected-after.txt \
                   logs/rpm-packages-after-removal.txt >&2 || true
              exit 1
            }
            for leftover in /etc/systemd/system/home-tester-mnt-media.mount \
                            /etc/systemd/system/home-tester-mnt-media.automount \
                            /etc/nasmount; do
              if [ -e "$leftover" ]; then
                echo "ERROR: removal left $leftover behind" >&2
                exit 1
              fi
            done
          fi
          printf '%s release smoke passed\n' '${{ matrix.target }}' > logs/result.txt
      - name: Upload release smoke report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-smoke-${{ matrix.target }}
          path: logs/
          if-no-files-found: error

  verify_release_set:
    name: Verify packages and assemble release assets
    needs: [validate_release, smoke_release_packages]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out validated tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate_release.outputs.tag }}
      - name: Install cross-package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio file jq rpm
      - name: Download final packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-package-*
          path: downloaded
          merge-multiple: true
      - name: Verify and assemble release set
        run: |
          mkdir packages metadata release
          find downloaded -maxdepth 2 -type f \( -name '*.deb' -o -name '*.rpm' \) -exec cp {} packages/ \;
          ./packaging/verify-artifact-set.sh packages metadata
          jq -e --arg commit '${{ needs.validate_release.outputs.commit }}' \
            '.commit == $commit' metadata/*-release-manifest.json >/dev/null
          source packaging/lib.sh
          read_release_contract "$PWD"
          cp metadata/* release/
          cp "packages/$NASMOUNT_DEB" "release/$NASMOUNT_DEB_RELEASE_ASSET"
          cp "packages/$NASMOUNT_RPM" "release/$NASMOUNT_RPM_RELEASE_ASSET"
          (cd release && sha256sum "$NASMOUNT_DEB_RELEASE_ASSET" \
            "$NASMOUNT_RPM_RELEASE_ASSET" > "$NASMOUNT_CHECKSUMS")
          cmp "packages/$NASMOUNT_DEB" "release/$NASMOUNT_DEB_RELEASE_ASSET"
          cmp "packages/$NASMOUNT_RPM" "release/$NASMOUNT_RPM_RELEASE_ASSET"
      - name: Upload final release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-release-set
          path: release/
          if-no-files-found: error

  attest_and_publish:
    name: Attest and publish release
    needs: [validate_release, verify_release_set]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out validated tag for publication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate_release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: final-native-release-set
          path: release
      - name: Attest DEB provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/*.deb
      - name: Attest RPM provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/*.rpm
      - name: Create, upload, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate_release.outputs.tag }}
          VERSION: ${{ needs.validate_release.outputs.version }}
        run: |
          DEB_ASSET=$(jq -r '.artifacts[] | select(.target == "ubuntu-26.04-amd64") | .release_asset' \
            release/*-release-manifest.json)
          RPM_ASSET=$(jq -r '.artifacts[] | select(.target == "fedora-44-x86_64") | .release_asset' \
            release/*-release-manifest.json)
          [ "$DEB_ASSET" = "nasmount-amd64-${VERSION}.deb" ]
          [ "$RPM_ASSET" = "nasmount-fedora44-x86_64-${VERSION}.rpm" ]
          [ -f "release/$DEB_ASSET" ]
          [ -f "release/$RPM_ASSET" ]
          printf '%s\n' \
            "Supported systems: Kubuntu/Ubuntu 26.04 LTS amd64 with Plasma 6, and Fedora KDE Plasma 44 x86_64." \
            "Requires Linux 6.8 or newer. This release supports clean installation only." \
            "" \
            "Ubuntu/Kubuntu download:" \
            "wget https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${DEB_ASSET}" \
            "Install: sudo apt install ./${DEB_ASSET}" \
            "" \
            "Fedora download:" \
            "wget https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${RPM_ASSET}" \
            "Install: sudo dnf install ./${RPM_ASSET}" \
            "Uninstall: nasmount-uninstall" \
            "Checksums: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/nasmount-${VERSION}-SHA256SUMS" \
            "Source: https://github.com/${GITHUB_REPOSITORY}/tree/${TAG}" > release-notes.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "nasmount $VERSION" --notes-file release-notes.txt
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "nasmount $VERSION" --notes-file release-notes.txt
          fi
          gh release upload "$TAG" release/*.deb release/*.rpm \
            release/*-SHA256SUMS release/*-release-manifest.json
          gh release edit "$TAG" --draft=false
